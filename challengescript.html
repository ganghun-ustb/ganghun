            filter: brightness(1.3);
        }
        .graph-node text {
            font-size: 9px;
            fill: #fff;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            font-weight: 600;
            user-select: none;
        }

            fill: #444;
            stroke: #555;

            fill: #f1c40f;

        // ============================================================
        // 3. 状态管理（localStorage独立存储）
        // ============================================================
        const STORAGE_KEY = 'metallurgy_task_progress';

        function loadProgress() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    return {
                        completed: new Set(data.completed || []),
                        medalCount: data.medalCount || 0
                    };
                } catch (e) {
                    return { completed: new Set(), medalCount: 0 };
                }
            }
            return { completed: new Set(), medalCount: 0 };
        }

        function saveProgress(completedSet, medalCount) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                completed: Array.from(completedSet),
                medalCount: medalCount
            }));
        }

        let completedNodes = new Set();

        function initState() {
            const state = loadProgress();
            completedNodes = state.completed;
            medalCount = state.medalCount;
            updateBadge();
        }

        function updateBadge() {
            document.getElementById('medalCount').textContent = medalCount;
        }

            saveProgress(completedNodes, medalCount);
        }

        // ============================================================
        // 4. 分支图布局与绘制
        // ============================================================
        function buildGraphData() {
            const edges = [];
            const nodeIds = Object.keys(storyData);
            nodeIds.forEach(id => {
                const node = storyData[id];
                if (node && node.options) {
                    node.options.forEach(opt => {
                        if (opt.nextId) edges.push({ from: id, to: opt.nextId });
                    });
                }
            });
            return { nodes: nodeIds, edges };
        }

        function layoutGraph() {
            const { nodes, edges } = buildGraphData();
            const depths = {};
            const visited = new Set();
            const queue = ['start'];
            depths['start'] = 0;
            visited.add('start');
            while (queue.length) {
                const id = queue.shift();
                const node = storyData[id];
                if (node && node.options) {
                    node.options.forEach(opt => {
                        const next = opt.nextId;
                        if (next && !visited.has(next) && storyData[next]) {
                            visited.add(next);
                            depths[next] = (depths[id] || 0) + 1;
                            queue.push(next);
                        }
                    });
                }
            }
            const groups = {};
            nodes.forEach(id => {
                const d = depths[id] !== undefined ? depths[id] : 99;
                if (!groups[d]) groups[d] = [];
                groups[d].push(id);
            });
            const positions = {};
            const maxDepth = Math.max(...Object.keys(groups).map(Number));
            const width = 880, height = 680;
            const hMargin = 50, vMargin = 50;
            Object.keys(groups).forEach(depth => {
                const ids = groups[depth];
                const count = ids.length;
                const spacing = (width - 2 * hMargin) / (count + 1);
                ids.forEach((id, idx) => {
                    const x = hMargin + (idx + 1) * spacing;
                    const y = vMargin + (parseInt(depth) / (maxDepth || 1)) * (height - 2 * vMargin);
                    positions[id] = { x, y };
                });
            });
            return positions;
        }

        function renderGraph() {
            const svg = document.getElementById('graph-svg');
            if (!svg) return;
            const positions = layoutGraph();

            const edges = [];
            Object.keys(storyData).forEach(id => {
                const node = storyData[id];
                if (node && node.options) {
                    node.options.forEach(opt => {
                        if (opt.nextId) edges.push({ from: id, to: opt.nextId });
                    });
                }
            });

            svg.innerHTML = '';

            // 连线
            edges.forEach(edge => {
                const fromPos = positions[edge.from];
                const toPos = positions[edge.to];
                if (!fromPos || !toPos) return;
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                const dx = toPos.x - fromPos.x;
                const dy = toPos.y - fromPos.y;
                const cp1x = fromPos.x + dx * 0.5;
                const cp1y = fromPos.y;
                const cp2x = toPos.x - dx * 0.5;
                const cp2y = toPos.y;
                path.setAttribute('d', `M ${fromPos.x} ${fromPos.y} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${toPos.x} ${toPos.y}`);
                path.setAttribute('class', 'graph-link');
                if (completedNodes.has(edge.from) && completedNodes.has(edge.to)) {
                    path.classList.add('completed');
                }
                svg.appendChild(path);
            });

            // 节点
            Object.keys(positions).forEach(id => {
                const pos = positions[id];
                const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                group.setAttribute('class', 'graph-node');
                group.dataset.id = id;

                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', pos.x);
                circle.setAttribute('cy', pos.y);
                circle.setAttribute('r', 20);

                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', pos.x);
                text.setAttribute('y', pos.y);
                text.setAttribute('font-size', '9');
                const label = nodeLabels[id] || id.substring(0, 4);
                text.textContent = label;

                if (completedNodes.has(id)) {
                    group.classList.add('completed');
                } else {
                    group.classList.add('incomplete');
                }

                group.appendChild(circle);
                group.appendChild(text);

                // 点击事件：弹窗
                group.addEventListener('click', function(e) {
                    const nodeId = this.dataset.id;
                    showNodeDetail(nodeId);
                });

                svg.appendChild(group);
            });
        }

        // ============================================================
        // 5. 弹窗逻辑

        let currentModalNodeId = null;

        function showNodeDetail(nodeId) {
            const node = storyData[nodeId];
            if (!node) return;

            currentModalNodeId = nodeId;
            const modal = document.getElementById('nodeModal');

            document.getElementById('modalTitle').textContent = nodeLabels[nodeId] || nodeId;
            document.getElementById('modalId').textContent = `ID: ${nodeId}`;

            // 状态
            const statusEl = document.getElementById('modalStatus');
            const isCompleted = completedNodes.has(nodeId);
            if (isCompleted) {
                statusEl.textContent = '✅ 已完成（已获得勋章）';
                statusEl.className = 'status-badge completed';
            } else {
                statusEl.textContent = '🔒 未完成';
                statusEl.className = 'status-badge incomplete';
            }

            // 任务和知识
            document.getElementById('modalTask').textContent = node.task || '（暂无任务）';
            document.getElementById('modalKnowledge').textContent = node.knowledge || '（暂无知识储备）';

            // 领取按钮
            const claimBtn = document.getElementById('claimBtn');
            if (isCompleted) {
                claimBtn.disabled = true;
                claimBtn.textContent = '🏅 已领取';
            } else {
                claimBtn.disabled = false;
                claimBtn.textContent = '🏅 领取勋章';
                // 移除旧监听，避免重复绑定
                claimBtn.onclick = null;
                claimBtn.onclick = function() {
                    claimMedal(nodeId);
                };
            }

            modal.classList.add('active');
        }

        function claimMedal(nodeId) {
            if (completedNodes.has(nodeId)) return;

            // 标记完成
            completedNodes.add(nodeId);
            medalCount += 1;
            updateBadge();
            saveState();
            renderGraph();

            // 更新弹窗状态
            const statusEl = document.getElementById('modalStatus');
            statusEl.textContent = '✅ 已完成（已获得勋章）';
            statusEl.className = 'status-badge completed';
            document.getElementById('claimBtn').disabled = true;
            document.getElementById('claimBtn').textContent = '🏅 已领取';

            // 可选：短暂的庆祝提示
            alert('🎉 恭喜你获得一枚冶金勋章！');
        }

        function closeModal() {
            document.getElementById('nodeModal').classList.remove('active');
        }
        // 点击背景关闭
        document.getElementById('nodeModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ============================================================
        // 6. 重置
        // ============================================================
        function resetAll() {
            if (confirm('确定要重置所有进度吗？')) {
                completedNodes.clear();
                medalCount = 0;
                updateBadge();
                saveState();
                renderGraph();
                closeModal();
            }
        }

        // ============================================================
        // 7. 初始化
        // ============================================================
        initState();
        renderGraph();
