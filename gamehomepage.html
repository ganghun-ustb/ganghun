            if (node.options) {
                node.options.forEach(opt => {
                    if (opt.nextId) edges.push({ from: id, to: opt.nextId });
                });
            }
        });
        return { nodes: nodeIds, edges };
    }

    function layoutGraph() {
        const { nodes, edges } = buildGraphData();
        // BFS 计算深度
        const depths = {};
        const visited = new Set();
        const queue = ['start'];
        depths['start'] = 0;
        visited.add('start');
        while (queue.length) {
            const id = queue.shift();
            const node = storyData[id];
            if (node && node.options) {
                node.options.forEach(opt => {
                    const next = opt.nextId;
                    if (next && !visited.has(next)) {
                        visited.add(next);
                        depths[next] = (depths[id] || 0) + 1;
                        queue.push(next);
                    }
                });
            }
        }
        // 按深度分组
        const groups = {};
        nodes.forEach(id => {
            const d = depths[id] !== undefined ? depths[id] : 99;
            if (!groups[d]) groups[d] = [];
            groups[d].push(id);
        });
        // 分配坐标
        const positions = {};
        const maxDepth = Math.max(...Object.keys(groups).map(Number));
        const nodeRadius = 20;
        const width = 780, height = 580;
        const hMargin = 40, vMargin = 40;
        Object.keys(groups).forEach(depth => {
            const ids = groups[depth];
            const count = ids.length;
            const spacing = (width - 2 * hMargin) / (count + 1);
            ids.forEach((id, idx) => {
                const x = hMargin + (idx + 1) * spacing;
                const y = vMargin + (parseInt(depth) / (maxDepth || 1)) * (height - 2 * vMargin);
                positions[id] = { x, y };
            });
        });
        return positions;
    }

    function renderGraph() {
        const svg = document.getElementById('graph-svg');
        if (!svg) return;
        const positions = layoutGraph();
        nodePositions = positions;

        // 构建边数据
        const edges = [];
        Object.keys(storyData).forEach(id => {
            const node = storyData[id];
            if (node.options) {
                node.options.forEach(opt => {
                    if (opt.nextId) edges.push({ from: id, to: opt.nextId });
                });
            }
        });

        // 清除旧内容
        svg.innerHTML = '';

        // 1. 绘制连线
        edges.forEach(edge => {
            const fromPos = positions[edge.from];
            const toPos = positions[edge.to];
            if (!fromPos || !toPos) return;
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            const dx = toPos.x - fromPos.x;
            const dy = toPos.y - fromPos.y;
            const cp1x = fromPos.x + dx * 0.5;
            const cp1y = fromPos.y;
            const cp2x = toPos.x - dx * 0.5;
            const cp2y = toPos.y;
            const d = `M ${fromPos.x} ${fromPos.y} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${toPos.x} ${toPos.y}`;
            path.setAttribute('d', d);
            path.setAttribute('class', 'graph-link');
            // 判断是否已访问（两端都访问才亮）
            if (visitedNodes.has(edge.from) && visitedNodes.has(edge.to)) {
                path.classList.add('visited');
            }
            svg.appendChild(path);
        });

        // 2. 绘制节点
        Object.keys(positions).forEach(id => {
            const pos = positions[id];
            const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            group.setAttribute('class', 'graph-node');
            group.dataset.id = id;

            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', pos.x);
            circle.setAttribute('cy', pos.y);
            circle.setAttribute('r', 18);
            circle.setAttribute('stroke-width', 2);

            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', pos.x);
            text.setAttribute('y', pos.y);
            text.setAttribute('font-size', '7');
            text.setAttribute('fill', '#fff');
            text.setAttribute('text-anchor', 'middle');
            text.setAttribute('dominant-baseline', 'central');
            // 显示节点ID缩写（取前3个字符）
            let label = id.length > 6 ? id.substring(0, 6) : id;
            text.textContent = label;

            // 状态
            if (id === currentId) {
                group.classList.add('current');
            } else if (visitedNodes.has(id)) {
                group.classList.add('visited');
            } else {
                group.classList.add('unvisited');
            }

            group.appendChild(circle);
            group.appendChild(text);

            // 点击事件：仅当已访问时可跳转
            group.addEventListener('click', function(e) {
                const nodeId = this.dataset.id;
                if (visitedNodes.has(nodeId) || nodeId === currentId) {
                    // 跳转
                    renderScene(nodeId);
                } else {
                    // 未解锁，无反应
                }
            });

            svg.appendChild(group);
        });
    }

    // ============================================================
    // 4. 渲染引擎（修改版，增加 visited 记录和图形更新）
    // ============================================================
    function renderScene(nodeId) {
        const node = storyData[nodeId];
        if (!node) return;

        // 记录访问
        visitedNodes.add(nodeId);
        currentId = nodeId;

        // 成就记录（如果结局有成就）
        if (node.ending && node.achievement) {
            if (!achievements.includes(node.achievement)) {
                achievements.push(node.achievement);
            }
        }

        const container = document.getElementById('game-container');
        if (!container) return;

        // ---- 构建状态栏 ----
        let statusHtml = `
            <div class="game-status">
                <span>🎯 当前阶段：<span class="badge">${node.id === 'start' ? '🌱 新生入学' : node.ending ? '🏁 人生终章' : '🚀 成长中'}</span></span>
                <span>📌 成就：<span class="achievement-list">${achievements.length > 0 ? achievements.map(a => `<span>${a}</span>`).join('') : '<span style="color:#666;font-size:0.8rem;">暂无</span>'}</span></span>
            </div>
        `;

        // ---- 构建故事主体 ----
        let html = statusHtml;
        html += `<div class="story-scene">`;
        html += `<div class="story-text">${node.text}</div>`;

        if (node.options && node.options.length > 0) {
            html += `<div class="options">`;
            node.options.forEach((opt) => {
                html += `<button class="option-btn" data-next="${opt.nextId}"><span class="icon">▸</span> ${opt.text}</button>`;
            });
            html += `</div>`;
        } else if (node.ending) {
            html += `
                <div class="ending">
                    <div class="big-icon">${node.endingIcon || '🎉'}</div>
                    <div class="ending-title">${node.endingTitle || '🎊 恭喜通关！'}</div>
                    <div class="ending-desc">${node.endingDesc || '你书写了属于自己的冶金人生故事。'}</div>
                    <button class="restart-btn" onclick="resetGame()">🔄 重新开始</button>
                </div>
            `;
        } else {
            html += `<div class="ending"><button class="restart-btn" onclick="resetGame()">🔄 重新开始</button></div>`;
        }

        html += `</div>`;
        container.innerHTML = html;

        // ---- 绑定选项点击事件 ----
        container.querySelectorAll('.option-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const next = this.dataset.next;
                if (next && storyData[next]) {
                    renderScene(next);
                } else {
                    alert('⚠️ 剧情尚未编写，请返回重试。');
                }
            });
        });

        // ---- 更新分支图 ----
        renderGraph();

        // 滚动到顶部
        document.querySelector('#wrapper').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // ============================================================
    // 5. 重置游戏
    // ============================================================
    function resetGame() {
        achievements = [];
        visitedNodes = new Set();
        currentId = 'start';
        renderScene('start');
    }

    // ============================================================
    // 6. 启动游戏
    // ============================================================
    renderScene('start');
    </script>

</body>
