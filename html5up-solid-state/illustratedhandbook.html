document.getElementById('countDisplay').textContent = scientists.length;

// ============================================================
// 渲染卡片
// ============================================================
const grid = document.getElementById('cardGrid');
scientists.forEach(s => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = s.id;
    card.innerHTML = `
        <div class="avatar">
    ${s.avatarImg 
        ? `<img src="${s.avatarImg}" alt="${s.name}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` 
        : s.avatarEmoji
    }
</div>
        <div class="name">${s.name}</div>
        <div class="title-tag">${s.title}</div>
        <div class="quote">${s.quote}</div>
    `;
    card.addEventListener('click', () => openModal(s.id));
    grid.appendChild(card);
});

// ============================================================
// 弹窗逻辑（与之前完全相同）
// ============================================================
const overlay = document.getElementById('modalOverlay');
const modalBody = document.getElementById('modalBody');
const closeBtn = document.getElementById('modalCloseBtn');

function openModal(id) {
    const s = scientists.find(p => p.id === id);
    if (!s) return;
    const info = s.fullInfo;
    const deathText = info.death ? ` — ${info.death}` : '';

    let timelineHtml = '';
    if (info.timeline && info.timeline.length) {
        timelineHtml = info.timeline.map(item =>
            `<div class="timeline-item"><span class="year">${item.year}</span><span>${item.desc}</span></div>`
        ).join('');
    }

    let honorsHtml = '';
    if (info.honors && info.honors.length) {
        honorsHtml = info.honors.map(h => `<span class="honor-tag">${h}</span>`).join('');
    }

    modalBody.innerHTML = `
        <div class="modal-hero">
            <div class="modal-avatar">
    ${s.avatarImg 
        ? `<img src="${s.avatarImg}" alt="${s.name}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` 
        : s.avatarEmoji
    }
</div>
            <div class="modal-info">
                <div class="name">${s.name}</div>
                <div class="sub">${info.birth}${deathText} · ${s.title}</div>
                <div class="badge">${info.summary}</div>
                <div class="desc">${info.summary}</div>
            </div>
        </div>
        <div class="modal-section">
            <h4>⏳ 生平时间轴</h4>
            <div class="timeline">${timelineHtml}</div>
        </div>
        <div class="modal-section">
            <h4>🏆 主要成就</h4>
            <div style="color:#c8d0e0;font-size:0.92rem;line-height:1.8;white-space:pre-wrap;">${info.achievement}</div>
        </div>
        <div class="modal-section">
            <h4>💬 经典名言</h4>
            <div class="highlight-quote">${info.famousQuote || s.quote}</div>
        </div>
        ${info.story ? `
        <div class="modal-section">
            <h4>📖 逸闻趣事</h4>
            <div class="story">${info.story}</div>
        </div>` : ''}
        ${honorsHtml ? `
        <div class="modal-section">
            <h4>🎖️ 荣誉角</h4>
            <div style="margin-top:0.2rem;">${honorsHtml}</div>
        </div>` : ''}
        <div style="margin-top:1.5rem;text-align:right;font-size:0.8rem;color:#4a5368;border-top:1px solid rgba(255,255,255,0.04);padding-top:1rem;">
            北京科技大学 · 钢铁摇篮
        </div>
    `;
    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeModal() {
    overlay.classList.remove('active');
    document.body.style.overflow = '';
}
closeBtn.addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
</script>
